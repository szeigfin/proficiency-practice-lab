<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practica · Nivel Uno</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A4A;--navy-light:#243558;--gold:#C9973A;--gold-light:#E8B85A;
  --cream:#FAF8F3;--cream-dark:#F0EDE4;--text:#1B2A4A;--muted:#6B7A94;
  --correct:#2E7D52;--correct-bg:#EAF5EE;--wrong:#B33A3A;--wrong-bg:#FAEAEA;
  --new:#6B7A94;--learning:#C9973A;--familiar:#1B6BB5;--mastered:#2E7D52;
  --grammar-accent:#5B3A8C;--grammar-light:#EDE8F7;
  --r:12px;--rs:8px;
}
html,body{min-height:100vh;background:#E8E4DA;font-family:'DM Sans',sans-serif;color:var(--text)}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 60px rgba(0,0,0,.12)}

/* HEADER */
.header{background:var(--navy);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.header-left{display:flex;align-items:baseline;gap:10px}
.h-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:#fff}
.h-sub{font-size:11px;color:var(--gold-light);font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.h-nav{display:flex;gap:5px}
.nav-btn{padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.nav-btn:hover,.nav-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}

/* MAIN */
.main{padding:22px 24px 40px}
.section-label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:18px 0 9px}
.section-label.grammar{color:var(--grammar-accent)}
.intro h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;margin-bottom:6px}
.intro p{font-size:13px;color:var(--muted);font-weight:300;line-height:1.6}
.divider{height:.5px;background:var(--cream-dark);margin:20px 0}

/* HOME STATS BAR */
.stats-bar{background:var(--cream);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.stats-big{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);flex-shrink:0}
.stats-sub{font-size:11px;color:var(--muted)}
.mastery-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* SECTION HEADERS */
.section-header{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.section-header-line{flex:1;height:.5px;background:var(--cream-dark)}
.section-header-title{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.section-header-title.vocab{color:var(--gold)}
.section-header-title.grammar{color:var(--grammar-accent)}

/* TOPIC / GRAMMAR CARDS */
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topic-card{background:#fff;border:1px solid #E8E4DA;border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.topic-card:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.topic-card.grammar-card{border-color:#DDD8EE}
.topic-card.grammar-card:hover{border-color:var(--grammar-accent)}
.topic-icon{font-size:20px;margin-bottom:6px}
.topic-name{font-size:12px;font-weight:500;color:var(--navy);line-height:1.3}
.topic-count{font-size:11px;color:var(--muted);margin-top:2px}
.topic-mastery{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.mastery-pip{height:4px;flex:1;min-width:4px;border-radius:2px;background:var(--cream-dark)}
.mastery-pip.new{background:var(--new)}
.mastery-pip.learning{background:var(--learning)}
.mastery-pip.familiar{background:var(--familiar)}
.mastery-pip.mastered{background:var(--mastered)}
.topic-badge{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:500}
.badge-mastered{background:var(--correct-bg);color:var(--correct)}
.badge-learning{background:#FDF8EF;color:var(--gold)}
.badge-new{background:var(--cream-dark);color:var(--muted)}
.badge-grammar{background:var(--grammar-light);color:var(--grammar-accent)}

/* ACTIVITY SCREEN */
.activity-header{background:var(--navy);padding:12px 24px;display:flex;align-items:center;gap:12px}
.progress-track{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:2px}
.progress-fill{height:3px;background:var(--gold);border-radius:2px;transition:width .4s}
.strip-info{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;font-weight:300}
.strip-score{font-size:11px;color:var(--gold-light);white-space:nowrap;font-weight:500}
.activity-type-badge{display:inline-flex;align-items:center;gap:6px;background:var(--cream-dark);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.activity-type-badge.grammar-badge{background:var(--grammar-light);color:var(--grammar-accent)}

/* QUESTION */
.q-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--navy);line-height:1.5;margin-bottom:18px}
.q-hint{font-size:13px;color:var(--muted);margin-bottom:16px;margin-top:-12px;font-style:italic}

/* OPTIONS */
.options-grid{display:grid;gap:8px}
.options-grid.two-col{grid-template-columns:1fr 1fr}
.option{width:100%;text-align:left;padding:12px 16px;border:1px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:11px;transition:all .15s}
.option:hover:not(:disabled){border-color:var(--navy);background:var(--cream)}
.opt-letter{width:24px;height:24px;border-radius:50%;border:1px solid #D8D4C8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;color:var(--muted)}
.option.correct{border-color:var(--correct);background:var(--correct-bg)}
.option.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}

/* MATCHING */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-col-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;text-align:center}
.match-card{padding:11px 12px;border:1.5px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--navy);text-align:center;transition:all .15s;min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.match-card:hover{border-color:var(--navy);background:var(--cream)}
.match-card.selected{border-color:var(--gold);background:#FDF8EF;font-weight:500}
.match-card.matched{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);cursor:default}
.match-card.wrong-flash{border-color:var(--wrong);background:var(--wrong-bg)}
.match-progress{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}

/* IMAGE */
.image-card{background:var(--cream);border:1px solid #E8E4DA;border-radius:var(--r);padding:24px;text-align:center;margin-bottom:16px}
.image-label{font-size:12px;color:var(--muted);margin-top:10px}

/* AUDIO */
.audio-prompt{background:var(--navy);border-radius:var(--r);padding:26px 24px;text-align:center;margin-bottom:20px;cursor:pointer;transition:background .15s}
.audio-prompt:hover{background:var(--navy-light)}
.audio-icon{font-size:34px;margin-bottom:8px}
.audio-word{font-family:'Playfair Display',serif;font-size:24px;color:#fff;margin-bottom:4px}
.audio-hint{font-size:12px;color:rgba(255,255,255,.5)}

/* FEEDBACK */
.feedback{background:var(--cream-dark);border-radius:var(--rs);padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
.feedback strong{color:var(--navy);font-weight:500}
.feedback.correct-fb{background:var(--correct-bg);border-left:3px solid var(--correct)}
.feedback.wrong-fb{background:var(--wrong-bg);border-left:3px solid var(--wrong)}
.next-btn{margin-top:14px;padding:11px 24px;background:var(--navy);color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.next-btn:hover{background:var(--navy-light)}

/* FILL BLANK */
.blank-input{width:100%;padding:12px 16px;border:1.5px solid #D8D4C8;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:16px;color:var(--navy);background:#fff;margin-bottom:10px;transition:border-color .15s}
.blank-input:focus{outline:none;border-color:var(--navy)}
.blank-input.correct{border-color:var(--correct);background:var(--correct-bg)}
.blank-input.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.submit-btn{padding:11px 24px;background:var(--gold);color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer}
.submit-btn:hover{background:#B8832E}

/* RESULT */
.result-header{background:var(--navy);padding:28px 24px 22px;text-align:center;border-bottom:3px solid var(--gold)}
.result-score{font-family:'Playfair Display',serif;font-size:52px;font-weight:600;color:#fff;line-height:1}
.result-score span{color:var(--gold)}
.result-msg{font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;font-weight:300;letter-spacing:.04em}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#D8D4C8;border:1px solid #D8D4C8;border-radius:var(--r);overflow:hidden;margin:18px 0}
.stat-cell{background:#fff;padding:14px 10px;text-align:center}
.stat-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;color:var(--navy)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.primary-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn:hover{background:var(--navy-light)}
.secondary-btn{width:100%;padding:12px;background:transparent;color:var(--navy);border:1px solid #D8D4C8;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:border-color .15s}
.secondary-btn:hover{border-color:var(--navy)}
.gold-bar{display:inline-block;width:20px;height:2px;background:var(--gold);vertical-align:middle;margin-right:4px}

/* PROGRESS */
.history-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.history-empty .big{font-size:32px;color:var(--cream-dark);margin-bottom:8px}

/* SETTINGS */
.voice-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;margin-bottom:7px;transition:all .15s}
.voice-card:hover{border-color:var(--navy)}
.voice-card.selected{border-color:var(--gold);background:#FDF8EF}

/* LOADING */
.loading-wrap{padding:56px 24px;text-align:center;color:var(--muted)}
.loading-word{font-family:'Playfair Display',serif;font-size:32px;color:var(--navy);margin-bottom:8px;display:block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

}

// MASTERY SYSTEM
// ═══════════════════════════════════════════════════════════
function loadMastery(){try{return JSON.parse(localStorage.getItem('nsa_mastery')||'{}');}catch{return{};}}
function saveMastery(m){try{localStorage.setItem('nsa_mastery',JSON.stringify(m));}catch{}}
function getWordStatus(topicId,word){
  const m=loadMastery();const d=m[topicId]?.[word];
  if(!d||d.correct===0)return'new';
  const u=new Set(d.sessions||[]).size;
  if(d.correct>=3&&u>=2)return'mastered';
  if(d.correct>=3)return'familiar';
  return'learning';
}
function recordAnswer(topicId,word,correct,sessionDate){
  const m=loadMastery();
  if(!m[topicId])m[topicId]={};
  if(!m[topicId][word])m[topicId][word]={correct:0,wrong:0,sessions:[]};
  if(correct){m[topicId][word].correct++;if(!m[topicId][word].sessions.includes(sessionDate))m[topicId][word].sessions.push(sessionDate);}
  else m[topicId][word].wrong=(m[topicId][word].wrong||0)+1;
  saveMastery(m);
}
function getTopicStats(topicId,keys){
  const c={new:0,learning:0,familiar:0,mastered:0};
  keys.forEach(k=>c[getWordStatus(topicId,k)]++);
  return c;
}
function getTopicBadge(topicId,keys){
  const s=getTopicStats(topicId,keys),t=keys.length;
  if(s.mastered===t)return{label:'Mastered ✓',cls:'badge-mastered'};
  if(s.mastered>0||s.familiar>0)return{label:'In progress',cls:'badge-learning'};
  return{label:'New',cls:'badge-new'};
}

// ═══════════════════════════════════════════════════════════
// VOCAB ACTIVITY GENERATION
// ═══════════════════════════════════════════════════════════
const ACTIVITY_TYPES=['multiple-choice','audio-to-word','matching','listen-match','fill-blank','multiple-choice'];
const VISUAL_ACTIVITY_TYPES=['multiple-choice','audio-to-word','image-assoc','matching','listen-match','fill-blank'];
function shuffle(arr){return[...arr].sort(()=>Math.random()-.5);}
function todayStr(){return new Date().toISOString().split('T')[0];}

function pickVocabWords(topic,n=6){
  const g={new:[],learning:[],familiar:[],mastered:[]};
  topic.words.forEach(w=>g[getWordStatus(topic.id,w[0])].push(w));
  return[...g.new,...g.learning,...g.familiar,...g.mastered].slice(0,n);
}

function buildVocabSession(topic){
  const words=pickVocabWords(topic,Math.min(topic.words.length,8));
  const types=topic.visual?VISUAL_ACTIVITY_TYPES:ACTIVITY_TYPES;
  return words.map((word,i)=>buildVocabActivity(types[i%types.length],word,topic));
}

function buildVocabActivity(type,word,topic){
  const[spanish,english]=word;
  const dist=topic.words.filter(w=>w[0]!==spanish).sort(()=>Math.random()-.5).slice(0,3);
  if(type==='multiple-choice'){const opts=shuffle([english,...dist.map(d=>d[1])]);return{type,word:spanish,answer:english,question:`What does "${spanish}" mean?`,options:opts,correct:opts.indexOf(english),actLabel:'Multiple Choice'};}
  if(type==='audio-to-word'){const opts=shuffle([english,...dist.map(d=>d[1])]);return{type,word:spanish,answer:english,question:'Listen and choose the correct meaning.',options:opts,correct:opts.indexOf(english),actLabel:'Listen & Choose'};}
  if(type==='image-assoc'){const opts=shuffle([spanish,...dist.map(d=>d[0])]);return{type,word:spanish,answer:spanish,image:getImage(spanish),imageLabel:english,question:'Which Spanish word matches this image?',options:opts,correct:opts.indexOf(spanish),actLabel:'Image Match'};}
  if(type==='fill-blank'){return{type,word:spanish,answer:spanish,question:`Translate to Spanish: "${english}"`,actLabel:'Fill in the Blank'};}
  if(type==='matching'||type==='listen-match'){const pairs=shuffle([word,...dist.slice(0,3)]).slice(0,4);return{type:'matching',listenMode:type==='listen-match',word:spanish,pairs,actLabel:type==='listen-match'?'Listen & Match':'Read & Match'};}
  const opts=shuffle([english,...dist.map(d=>d[1])]);return{type:'multiple-choice',word:spanish,answer:english,question:`What does "${spanish}" mean?`,options:opts,correct:opts.indexOf(english),actLabel:'Multiple Choice'};
}

// ═══════════════════════════════════════════════════════════
// GRAMMAR SESSION GENERATION
// ═══════════════════════════════════════════════════════════
function pickGrammarQuestions(topic,n=8){
  const g={new:[],learning:[],familiar:[],mastered:[]};
  topic.questions.forEach(q=>g[getWordStatus(topic.id,q.q)].push(q));
  return shuffle([...g.new,...g.learning,...g.familiar,...g.mastered]).slice(0,n);
}

function buildGrammarSession(topic){
  return pickGrammarQuestions(topic,Math.min(topic.questions.length,8)).map(q=>({
    type:'grammar-mc',
    word:q.q,
    question:q.q,
    options:q.opts,
    correct:q.ans,
    explanation:q.exp,
    actLabel:'Grammar in Action',
    isGrammar:true,
  }));
}

function getSpanishVoices(){return window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es')).sort((a,b)=>a.name.localeCompare(b.name));}
function getSavedVoice(){const saved=localStorage.getItem('nsa_voice');const voices=getSpanishVoices();if(saved){const v=voices.find(v=>v.name===saved);if(v)return v;}return voices.find(v=>/Monica|Jorge|Paulina|Diego|Marisol|Lucia|Miguel/i.test(v.name))||voices[0]||null;}
function getSavedRate(){return parseFloat(localStorage.getItem('nsa_rate')||'0.85');}
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=getSavedRate();u.pitch=1;const v=getSavedVoice();if(v)u.voice=v;window.speechSynthesis.speak(u);}
window.speechSynthesis&&window.speechSynthesis.getVoices();

  let bodyHTML='';
  if(act.type==='grammar-mc'||act.type==='multiple-choice') bodyHTML=mcHTML(act);
  else if(act.type==='audio-to-word') bodyHTML=audioHTML(act);
  else if(act.type==='image-assoc') bodyHTML=imageHTML(act);
  else if(act.type==='fill-blank') bodyHTML=fillHTML(act);
  else if(act.type==='matching') bodyHTML=matchHTML(act);

  return`${hdr('home')}

  return`${hdr('home')}
  <div class="result-header">
    <div class="result-score">${pct}<span>%</span></div>
    <div class="result-msg">${msg} · ${topic.icon} ${topic.label}</div>

  <div class="main">

// ── READING COMPREHENSION ────────────────────────────────
function readingHTML(){
  const p = S.readingPassage;
  if(!p) { S.screen='home'; render(); return ''; }

  // Show result if all questions done
  if(S.readingQ >= p.questions.length) {
    return readingResultHTML(p);
  }

  const q = p.questions[S.readingQ];
  const pct = Math.round((S.readingQ / p.questions.length)*100);
  const LETTERS = ['A','B','C','D'];

  return `${hdr('home')}
  <div class="activity-header">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="strip-info">${p.icon} ${p.type}</span>
    <span class="strip-score">${S.readingScore}✓ ${S.readingQ+1}/${p.questions.length}</span>
  </div>
  <div class="main">
    <div class="activity-type-badge" style="background:#EBF3FC;color:#1B6BB5">📄 Reading Comprehension</div>

    <!-- English context -->
    <div style="font-size:13px;color:var(--muted);font-style:italic;margin-bottom:8px">
      <strong style="color:var(--navy);font-style:normal">Context:</strong> ${p.contextEng}
    </div>

    <!-- Authentic Spanish text -->
    <div style="background:var(--cream);border:1px solid #D8E8F0;border-left:3px solid #1B6BB5;border-radius:var(--rs);padding:14px 16px;margin-bottom:18px;font-family:monospace;font-size:13px;color:var(--navy);line-height:1.7;white-space:pre-wrap;overflow-x:auto">${p.text}</div>

    <!-- Question -->
    <div class="q-text" style="font-size:16px">${q.q}</div>
    <div class="options-grid">
      ${q.opts.map((opt,i)=>{
        let cls='';
        if(S.readingAnswered){if(i===q.ans)cls='correct';else if(i===S.readingChosen&&i!==q.ans)cls='wrong';}
        return `<button class="option ${cls}" data-ropt="${i}" ${S.readingAnswered?'disabled':''}>
          <span class="opt-letter">${LETTERS[i]}</span>${opt}</button>`;
      }).join('')}
    </div>

    ${S.readingAnswered ? `
      <div class="feedback ${S.readingChosen===q.ans?'correct-fb':'wrong-fb'}">
        <strong>${S.readingChosen===q.ans?'¡Correcto!':'Not quite.'}</strong>
        ${S.readingChosen!==q.ans?` The answer is <strong>${q.opts[q.ans]}</strong>.`:''}
        <br><span style="margin-top:4px;display:block">${q.exp}</span>
      </div>
      <button class="next-btn" id="reading-next">
        ${S.readingQ<p.questions.length-1?'Next question →':'Ver resultados →'}
      </button>
    ` : ''}
  </div>`;
}

function readingResultHTML(p){
  const pct = Math.round((S.readingScore/p.questions.length)*100);
  const msg = pct>=80?'¡Excelente!':pct>=60?'¡Buen trabajo!':'¡Sigue practicando!';
  const color = pct>=80?'var(--correct)':pct>=60?'var(--gold)':'var(--wrong)';
  return `${hdr('home')}
  <div class="result-header">
    <div class="result-score">${pct}<span>%</span></div>
    <div class="result-msg">${msg} · ${p.icon} ${p.type}</div>
  </div>
  <div class="main">
    <div class="stat-row">
      <div class="stat-cell"><div class="stat-val" style="color:var(--correct)">${S.readingScore}</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:var(--wrong)">${p.questions.length-S.readingScore}</div><div class="stat-lbl">Incorrect</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:${color}">${pct}%</div><div class="stat-lbl">Score</div></div>
    </div>
    <button class="primary-btn" id="reading-retry"><span class="gold-bar"></span>Read again</button>
    <button class="secondary-btn" id="home-btn" style="margin-top:8px">Choose a different topic</button>

// ═══════════════════════════════════════════════════════════
// BIND
// ═══════════════════════════════════════════════════════════
function bind(){
  document.getElementById('nav-home')?.addEventListener('click',()=>{S.screen='home';render();});
  document.getElementById('nav-prog')?.addEventListener('click',()=>{S.screen='progress';render();});
  document.getElementById('nav-set')?.addEventListener('click',()=>{S.screen='settings';render();});
  document.querySelectorAll('[data-topic]').forEach(c=>c.addEventListener('click',()=>{
    const mode = c.dataset.mode;
    const topicId = c.dataset.topic;
    if(mode==='grammar') {
      S.topicId = topicId; S.mode = mode;
      S.screen = 'concept'; render();
    } else if(mode==='reading') {
      S.topicId = topicId; S.mode = 'reading';
      S.screen = 'reading'; S.readingPassage = READING_PASSAGES.find(p=>p.id===topicId);
      S.readingQ = 0; S.readingScore = 0; S.readingAnswered = false; S.readingChosen = null;
      render();
    } else {
      startSession(topicId, mode);
    }
  }));
  document.getElementById('start-practice-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.getElementById('skip-concept-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>answerMC(+b.dataset.opt)));
  document.getElementById('audio-btn')?.addEventListener('click',function(){speak(this.dataset.speak);});
  const fi=document.getElementById('fill-input');
  if(fi){fi.addEventListener('input',e=>{S.fillValue=e.target.value;});fi.addEventListener('keydown',e=>{if(e.key==='Enter')submitFill();});}
  document.getElementById('fill-submit')?.addEventListener('click',submitFill);
  document.querySelectorAll('[data-left]').forEach(c=>c.addEventListener('click',()=>{
    const act=S.activities[S.current];const i=+c.dataset.left;
    const word=act.listenMode?c.dataset.speak:act.pairs[i][0];
    if(word)speak(word);if(act.listenMode)act._heard[i]=true;
    matchSelectLeft(i);
  }));
  document.querySelectorAll('[data-right]').forEach(c=>c.addEventListener('click',()=>matchSelectRight(+c.dataset.right)));
  document.getElementById('next-btn')?.addEventListener('click',nextActivity);
  document.getElementById('retry-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.getElementById('home-btn')?.addEventListener('click',()=>{S.screen='home';render();});
  document.querySelectorAll('[data-ropt]').forEach(b=>b.addEventListener('click',()=>{
    if(S.readingAnswered) return;
    const i=+b.dataset.ropt; const p=S.readingPassage; const q=p.questions[S.readingQ];
    S.readingAnswered=true; S.readingChosen=i;
    if(i===q.ans){ S.readingScore++; recordAnswer('reading_'+p.id,q.q,true,S.sessionDate); }
    else recordAnswer('reading_'+p.id,q.q,false,S.sessionDate);
    render();
  }));
  document.getElementById('reading-next')?.addEventListener('click',()=>{
    S.readingQ++; S.readingAnswered=false; S.readingChosen=null; render();
  });
  document.getElementById('reading-retry')?.addEventListener('click',()=>{
    S.readingQ=0; S.readingScore=0; S.readingAnswered=false; S.readingChosen=null; render();
  });
  document.getElementById('clear-btn')?.addEventListener('click',()=>{if(confirm('Reset all progress? This cannot be undone.')){localStorage.removeItem('nsa_mastery');render();}});
  document.querySelectorAll('[data-voice]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('nsa_voice',b.dataset.voice);speak(b.dataset.preview||'hola');render();}));
  document.getElementById('rate-slider')?.addEventListener('input',e=>localStorage.setItem('nsa_rate',e.target.value));
}

// ═══════════════════════════════════════════════════════════
// SESSION LOGIC
// ═══════════════════════════════════════════════════════════
function startSession(topicId,mode){
  S.topicId=topicId;S.mode=mode;
  if(mode==='grammar'){const t=GRAMMAR_TOPICS.find(t=>t.id===topicId);S.activities=buildGrammarSession(t);}
  else{const t=VOCAB_TOPICS.find(t=>t.id===topicId);S.activities=buildVocabSession(t);}
  S.current=0;S.sessionCorrect=0;S.sessionDate=todayStr();
  S.answered=false;S.chosen=null;S.fillValue='';
  S.matchLeft=null;S.matchRight=null;S.matchedPairs=[];S.wrongFlash=null;
  S.screen='session';render();
  const act=S.activities[0];
  if(act.type==='audio-to-word')setTimeout(()=>speak(act.word),400);
  if(act.type==='matching'&&act.listenMode)setTimeout(()=>{speak(act.pairs[0][0]);act._heard[0]=true;render();},400);
}

function answerMC(i){
  if(S.answered)return;
  const act=S.activities[S.current];S.answered=true;S.chosen=i;
  const ok=i===act.correct;if(ok)S.sessionCorrect++;
  recordAnswer(S.topicId,act.word,ok,S.sessionDate);render();
}

function submitFill(){
  if(S.answered)return;
  const act=S.activities[S.current];S.answered=true;
  const ok=S.fillValue.trim().toLowerCase()===act.answer.toLowerCase();
  if(ok)S.sessionCorrect++;recordAnswer(S.topicId,act.word,ok,S.sessionDate);render();
}

function matchSelectLeft(i){
  const act=S.activities[S.current];
  if(S.matchedPairs.some(mp=>mp[0]===i))return;
  S.matchLeft=i;S.wrongFlash=null;
  if(S.matchRight!==null)tryMatch(act);else render();
}

function matchSelectRight(i){
  const act=S.activities[S.current];
  if(S.matchedPairs.some(mp=>mp[1]===i))return;
  S.matchRight=i;S.wrongFlash=null;
  if(S.matchLeft!==null)tryMatch(act);else render();
}

function tryMatch(act){
  const li=S.matchLeft,ri=S.matchRight;
  const leftWord=act.pairs[li][0];const rightWord=act._rightWords[ri];
  const ok=act.pairs.find(p=>p[0]===leftWord&&p[1]===rightWord);
  if(ok){S.matchedPairs.push([li,ri]);recordAnswer(S.topicId,leftWord,true,S.sessionDate);if(S.matchedPairs.length===act.pairs.length)S.sessionCorrect++;}
  else{recordAnswer(S.topicId,leftWord,false,S.sessionDate);S.wrongFlash='L'+li;setTimeout(()=>{S.wrongFlash=null;S.matchLeft=null;S.matchRight=null;render();},700);}
  S.matchLeft=null;S.matchRight=null;render();
}

function nextActivity(){
  if(S.current<S.activities.length-1){
    S.current++;S.answered=false;S.chosen=null;S.fillValue='';
    S.matchLeft=null;S.matchRight=null;S.matchedPairs=[];S.wrongFlash=null;
    render();
    const act=S.activities[S.current];
    if(act.type==='audio-to-word')setTimeout(()=>speak(act.word),400);
    if(act.type==='matching'&&act.listenMode)setTimeout(()=>{speak(act.pairs[0][0]);act._heard[0]=true;render();},400);
  }else{S.screen='result';render();}
}

render();
</script>
