<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practica · Nivel Tres</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2A4A;--navy-light:#243558;--gold:#C9973A;--gold-light:#E8B85A;--cream:#FAF8F3;--cream-dark:#F0EDE4;--text:#1B2A4A;--muted:#6B7A94;--correct:#2E7D52;--correct-bg:#EAF5EE;--wrong:#B33A3A;--wrong-bg:#FAEAEA;--new:#6B7A94;--learning:#C9973A;--familiar:#1B6BB5;--mastered:#2E7D52;--grammar-accent:#5B3A8C;--grammar-light:#EDE8F7;--r:12px;--rs:8px;}
html,body{min-height:100vh;background:#E8E4DA;font-family:'DM Sans',sans-serif;color:var(--text)}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 60px rgba(0,0,0,.12)}
.header{background:var(--navy);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.header-left{display:flex;align-items:baseline;gap:10px}
.h-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:#fff}
.h-sub{font-size:11px;color:var(--gold-light);font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.h-nav{display:flex;gap:5px}
.nav-btn{padding:5px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.nav-btn:hover,.nav-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
.main{padding:22px 24px 40px}
.intro h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;margin-bottom:6px}
.intro p{font-size:13px;color:var(--muted);font-weight:300;line-height:1.6}
.stats-bar{background:var(--cream);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.stats-big{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);flex-shrink:0}
.stats-sub{font-size:11px;color:var(--muted)}
.mastery-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.section-header{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.section-header-line{flex:1;height:.5px;background:var(--cream-dark)}
.section-header-title{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topic-card{background:#fff;border:1px solid #E8E4DA;border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.topic-card:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.topic-card.grammar-card{border-color:#DDD8EE}
.topic-card.grammar-card:hover{border-color:var(--grammar-accent)}
.topic-icon{font-size:20px;margin-bottom:6px}
.topic-name{font-size:12px;font-weight:500;color:var(--navy);line-height:1.3}
.topic-count{font-size:11px;color:var(--muted);margin-top:2px}
.topic-mastery{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.mastery-pip{height:4px;flex:1;min-width:4px;border-radius:2px;background:var(--cream-dark)}
.mastery-pip.new{background:var(--new)}.mastery-pip.learning{background:var(--learning)}.mastery-pip.familiar{background:var(--familiar)}.mastery-pip.mastered{background:var(--mastered)}
.topic-badge{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:500}
.badge-mastered{background:var(--correct-bg);color:var(--correct)}.badge-learning{background:#FDF8EF;color:var(--gold)}.badge-new{background:var(--cream-dark);color:var(--muted)}.badge-grammar{background:var(--grammar-light);color:var(--grammar-accent)}
.activity-header{background:var(--navy);padding:12px 24px;display:flex;align-items:center;gap:12px}
.progress-track{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:2px}
.progress-fill{height:3px;background:var(--gold);border-radius:2px;transition:width .4s}
.strip-info{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;font-weight:300}
.strip-score{font-size:11px;color:var(--gold-light);white-space:nowrap;font-weight:500}
.activity-type-badge{display:inline-flex;align-items:center;gap:6px;background:var(--cream-dark);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.activity-type-badge.grammar-badge{background:var(--grammar-light);color:var(--grammar-accent)}
.q-text{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;color:var(--navy);line-height:1.5;margin-bottom:18px}
.options-grid{display:grid;gap:8px}.options-grid.two-col{grid-template-columns:1fr 1fr}
.option{width:100%;text-align:left;padding:12px 16px;border:1px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:11px;transition:all .15s}
.option:hover:not(:disabled){border-color:var(--navy);background:var(--cream)}
.opt-letter{width:24px;height:24px;border-radius:50%;border:1px solid #D8D4C8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;color:var(--muted)}
.option.correct{border-color:var(--correct);background:var(--correct-bg)}.option.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg)}.option.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-col-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;text-align:center}
.match-card{padding:11px 12px;border:1.5px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--navy);text-align:center;transition:all .15s;min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.match-card:hover{border-color:var(--navy);background:var(--cream)}.match-card.selected{border-color:var(--gold);background:#FDF8EF;font-weight:500}.match-card.matched{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);cursor:default}.match-card.wrong-flash{border-color:var(--wrong);background:var(--wrong-bg)}
.match-progress{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.audio-prompt{background:var(--navy);border-radius:var(--r);padding:26px 24px;text-align:center;margin-bottom:20px;cursor:pointer;transition:background .15s}
.audio-prompt:hover{background:var(--navy-light)}
.audio-icon{font-size:34px;margin-bottom:8px}.audio-word{font-family:'Playfair Display',serif;font-size:24px;color:#fff;margin-bottom:4px}.audio-hint{font-size:12px;color:rgba(255,255,255,.5)}
.feedback{background:var(--cream-dark);border-radius:var(--rs);padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px}
.feedback strong{color:var(--navy);font-weight:500}.feedback.correct-fb{background:var(--correct-bg);border-left:3px solid var(--correct)}.feedback.wrong-fb{background:var(--wrong-bg);border-left:3px solid var(--wrong)}
.next-btn{margin-top:14px;padding:11px 24px;background:var(--navy);color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.next-btn:hover{background:var(--navy-light)}
.blank-input{width:100%;padding:12px 16px;border:1.5px solid #D8D4C8;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:16px;color:var(--navy);background:#fff;margin-bottom:10px;transition:border-color .15s}
.blank-input:focus{outline:none;border-color:var(--navy)}.blank-input.correct{border-color:var(--correct);background:var(--correct-bg)}.blank-input.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.submit-btn{padding:11px 24px;background:var(--gold);color:#fff;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer}
.submit-btn:hover{background:#B8832E}
.result-header{background:var(--navy);padding:28px 24px 22px;text-align:center;border-bottom:3px solid var(--gold)}
.result-score{font-family:'Playfair Display',serif;font-size:52px;font-weight:600;color:#fff;line-height:1}.result-score span{color:var(--gold)}
.result-msg{font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;font-weight:300;letter-spacing:.04em}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#D8D4C8;border:1px solid #D8D4C8;border-radius:var(--r);overflow:hidden;margin:18px 0}
.stat-cell{background:#fff;padding:14px 10px;text-align:center}
.stat-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;color:var(--navy)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.primary-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn:hover{background:var(--navy-light)}
.secondary-btn{width:100%;padding:12px;background:transparent;color:var(--navy);border:1px solid #D8D4C8;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:border-color .15s}
.secondary-btn:hover{border-color:var(--navy)}
.gold-bar{display:inline-block;width:20px;height:2px;background:var(--gold);vertical-align:middle;margin-right:4px}
.voice-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #D8D4C8;border-radius:var(--rs);background:#fff;cursor:pointer;margin-bottom:7px;transition:all .15s}
.voice-card:hover{border-color:var(--navy)}.voice-card.selected{border-color:var(--gold);background:#FDF8EF}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

const GRAMMAR_TOPICS=[
{id:'g3_imperf',icon:'📖',label:'Imperfect Tense',questions:[
{q:'Cuando era nino, yo _____ mucho. (jugar)',opts:['jugaba','jugue','juego','jugare'],ans:0,exp:'The imperfect describes habitual past actions or ongoing states. Jugar (o->ue stem changer) imperfect: jugaba. Regular -ar imperfect endings: -aba, -abas, -aba, -abamos, -aban.'},
{q:'Todos los veranos nosotros _____ a la playa. (ir)',opts:['ibamos','fuimos','vamos','iriamos'],ans:0,exp:'IR is irregular in the imperfect: iba, ibas, iba, ibamos, iban. Imperfect for repeated past events.'},
{q:'Ella siempre _____ cafe por la manana. (tomar)',opts:['tomo','tomaba','tomara','tomara'],ans:1,exp:'Siempre (always) signals habitual past action -> imperfect. Tomar: tomaba.'},
{q:'Eran las tres de la tarde cuando _____ el telefono. (sonar)',opts:['sonaba','sono','suena','sonara'],ans:1,exp:'The ringing phone was a single completed action interrupting background -> preterit. Background time (eran) uses imperfect.'},
{q:'Ser imperfecto: yo _____',opts:['fui','era','soy','seria'],ans:1,exp:'SER is irregular in the imperfect: era, eras, era, eramos, eran.'},
{q:'Ver imperfecto: ellos _____',opts:['vieron','ven','veian','veran'],ans:2,exp:'VER is irregular in the imperfect: veia, veias, veia, veiamos, veian. Ellos -> veian.'},
{q:'El imperfecto se usa para _____.',opts:['acciones completadas','estados habituales en el pasado','el futuro','mandatos'],ans:1,exp:'The imperfect expresses: habitual past actions (used to), past states/descriptions, background info, and ongoing past situations.'},
{q:'Cuando era joven, ella _____ el violin. (tocar)',opts:['toco','tocara','tocaba','toca'],ans:2,exp:'Habitual past action (she used to play) -> imperfect. Tocar: tocaba.'},
]},
{id:'g3_pret_imperf',icon:'⚡',label:'Preterit vs. Imperfect',questions:[
{q:'Yo _____ cuando sono el telefono. (estudiar)',opts:['estudiaba','estudie','estudio','estudiare'],ans:0,exp:'The interrupted ongoing action uses imperfect (estudiaba). The interrupting completed action (sono) uses preterit.'},
{q:'Ayer ella _____ al supermercado. (ir)',opts:['iba','fue','va','ira'],ans:1,exp:'Ayer (yesterday) + single completed trip -> preterit. Fue.'},
{q:'Cada dia el _____ a correr por el parque. (salir)',opts:['salio','salia','sale','saldra'],ans:1,exp:'Cada dia (every day) signals habitual past -> imperfect. Salir: salia.'},
{q:'De repente, todos _____ . (levantarse)',opts:['se levantaban','se levantaron','se levantan','se levantaran'],ans:1,exp:'De repente (suddenly) signals a sudden completed action -> preterit. Se levantaron.'},
{q:'Cuando eramos jovenes, _____ mucho. (viajar)',opts:['viajamos','viajabamos','viajamos','viajariamos'],ans:1,exp:'Cuando eramos (imperfect state) + habitual action -> imperfect. Viajabamos.'},
{q:'El verano pasado nosotros _____ en Madrid. (vivir)',opts:['viviamos','vivimos','vivimos','viviremos'],ans:1,exp:'El verano pasado = one specific completed time period -> preterit. Vivimos.'},
{q:'Mientras ella _____ , el llego. (dormir)',opts:['durmio','dormia','duerme','dormira'],ans:1,exp:'Mientras (while) + ongoing background action -> imperfect. Dormia.'},
{q:'Cual frase usa bien el imperfecto?',opts:['Ayer fui al banco.','Siempre ibamos al parque los domingos.','El lunes llegue tarde.','Ella hablo con el jefe.'],ans:1,exp:'Siempre ibamos = habitual past action -> correct imperfect use. The others describe single completed events -> preterit.'},
]},
{id:'g3_conditional',icon:'🔮',label:'Conditional Tense',questions:[
{q:'Con mas dinero, yo _____ a Espana. (viajar)',opts:['viajaria','viajare','viajaba','viaje'],ans:0,exp:'Conditional expresses what would happen. Regular formation: infinitive + ia endings. Viajar -> viajaria.'},
{q:'Ella dijo que _____ manana. (venir)',opts:['vendria','vendra','vino','viene'],ans:0,exp:'VENIR has an irregular conditional stem: vendr-. Ella -> vendria.'},
{q:'Que _____ tu en mi lugar? (hacer)',opts:['hacias','haras','hiciste','harias'],ans:3,exp:'HACER has irregular conditional stem: har-. Tu -> harias.'},
{q:'Nosotros _____ mas si tuvieramos tiempo. (estudiar)',opts:['estudiabamos','estudiaremos','estudiariamos','estudiamos'],ans:2,exp:'Regular conditional: nosotros estudiar + iamos = estudiariamos.'},
{q:'El condicional de PODER es _____.',opts:['podria','pudiera','podra','pudo'],ans:0,exp:'PODER has irregular conditional stem: podr-. Yo -> podria, el -> podria, etc.'},
{q:'Deberian llamar antes de llegar. Deberian significa _____.',opts:['they called','they will call','they should call','they were calling'],ans:2,exp:'DEBER in conditional = should. Deberian = they should (do something).'},
{q:'Si tuviera un millon de dolares, _____ una casa grande. (comprar)',opts:['compraria','comprare','compraba','compre'],ans:0,exp:'Si + imperfect subjunctive, conditional. Comprar -> compraria.'},
{q:'Ellos dijeron que _____ a la fiesta. (llegar)',opts:['llegaron','llegaban','llegarian','lleguen'],ans:2,exp:'Reporting what someone said they would do -> conditional. Llegar -> llegarian.'},
]},
{id:'g3_past_perf',icon:'⏮️',label:'Past Perfect (Pluscuamperfecto)',questions:[
{q:'Cuando llegue, ella ya _____ . (salir)',opts:['salio','salia','habia salido','habra salido'],ans:2,exp:'Past perfect = haber (imperfect) + past participle. Expresses what had happened before another past event. Habia salido.'},
{q:'El pasado participio de HABLAR es _____.',opts:['hablado','hablando','hablo','hablaba'],ans:0,exp:'Regular -ar past participles: drop -ar, add -ado. Hablar -> hablado.'},
{q:'El pasado participio de COMER es _____.',opts:['comiendo','comido','como','comera'],ans:1,exp:'Regular -er past participles: drop -er, add -ido. Comer -> comido.'},
{q:'Nosotros ya _____ cuando llego el profesor. (terminar)',opts:['terminabamos','terminamos','habiamos terminado','terminariamos'],ans:2,exp:'Past perfect: habiamos + terminado. We had already finished (before the teacher arrived).'},
{q:'El pasado participio de ESCRIBIR es _____.',opts:['escribiendo','escrito','escribido','escribira'],ans:1,exp:'ESCRIBIR has an irregular past participle: escrito. Other irregulars: hecho (hacer), dicho (decir), visto (ver), puesto (poner).'},
{q:'El pluscuamperfecto usa _____ + participio pasado.',opts:['haber en presente','haber en imperfecto','ser en preterito','estar en futuro'],ans:1,exp:'Pluscuamperfecto = imperfect of haber (habia, habias, habia, habiamos, habian) + past participle.'},
{q:'Yo nunca _____ tapas antes de ir a Espana. (probar)',opts:['probe','probaba','habia probado','probaria'],ans:2,exp:'Habia probado = I had (never) tried. Past perfect for what had (or had not) occurred before a reference point.'},
{q:'Cuando ella llamo, yo ya _____ la tarea. (hacer)',opts:['hacia','hice','habia hecho','hare'],ans:2,exp:'HACER has irregular participle: hecho. Habia hecho = I had already done (the homework).'},
]},
{id:'g3_subjunctive',icon:'💫',label:'Subjunctive (Introduction)',questions:[
{q:'Quiero que tu _____ la verdad. (decir)',opts:['dices','dijiste','digas','diras'],ans:2,exp:'Querer que + subjunctive. The subjunctive is used after expressions of desire, emotion, doubt, and impersonal expressions. Decir subjunctive: digas.'},

{q:'El subjuntivo se usa despues de _____.',opts:['verbos de certeza','verbos de deseo/emocion/duda','el preterito siempre','preguntas directas'],ans:1,exp:'The subjunctive follows verbs of desire (querer, esperar), emotion (alegrarse, temer), doubt (dudar, no creer), and impersonal expressions (es importante, es necesario).'},

const GRAMMAR_CONCEPTS={
g3_imperf:{title:'Imperfect Tense',summary:'The imperfect describes habitual or repeated past actions, background descriptions, ongoing states, and age/time in the past. Think: used to, was/were doing, would (habitually).',examples:[['Cuando era nino, jugaba mucho.','When I was a child, I used to play a lot.'],['Todos los veranos ibamos a la playa.','Every summer we would go to the beach.'],['Eran las tres de la tarde.','It was three in the afternoon.']],tip:'Regular -ar imperfect: -aba, -abas, -aba, -abamos, -aban. Regular -er/-ir: -ia, -ias, -ia, -iamos, -ian. Only 3 irregular verbs: ser (era), ir (iba), ver (veia).'},
g3_pret_imperf:{title:'Preterit vs. Imperfect',summary:'These two past tenses work together. The imperfect sets the scene (background, ongoing) while the preterit describes the action that happened (completed, sudden).',examples:[['Yo estudiaba cuando sono el telefono.','I was studying (imperf) when the phone rang (pret).'],['Siempre viajabamos en verano.','We always used to travel in summer. (habitual -> imperf)'],['Ayer fui al mercado.','Yesterday I went to the market. (single event -> pret)']],tip:'Keywords for PRETERIT: ayer, anoche, de repente, por fin, una vez. Keywords for IMPERFECT: siempre, todos los dias, cada ano, mientras, de nino/a, generalmente.'},
g3_conditional:{title:'Conditional Tense',summary:'The conditional expresses what would happen under certain conditions. Also used for polite requests and reported speech.',examples:[['Con mas tiempo, viajaria por todo el mundo.','With more time, I would travel the world.'],['Me podria decir donde esta el banco?','Could you tell me where the bank is? (polite)'],['Dijo que vendria manana.','He said he would come tomorrow. (reported speech)']],tip:'Regular conditional: full infinitive + -ia, -ias, -ia, -iamos, -ian. Irregular stems match future irregulars: querer->querr-, poder->podr-, hacer->har-, venir->vendr-, salir->saldr-.'},
g3_past_perf:{title:'Past Perfect (Pluscuamperfecto)',summary:'The past perfect expresses what had already happened before another past event. Formed with haber in the imperfect + past participle.',examples:[['Cuando llegue, ella ya habia salido.','When I arrived, she had already left.'],['Nunca habia comido paella antes.','I had never eaten paella before.'],['Ya habiamos terminado cuando llego el profesor.','We had already finished when the teacher arrived.']],tip:'Formation: habia/habias/habia/habiamos/habian + past participle. Key irregular participles: hecho (hacer), dicho (decir), escrito (escribir), visto (ver), puesto (poner), vuelto (volver), abierto (abrir).'},
g3_subjunctive:{title:'Subjunctive — Introduction',summary:'The subjunctive is a mood (not a tense) used to express wishes, emotions, doubt, and hypothetical situations. It appears in the clause after que when the main verb triggers it.',examples:[['Quiero que tu vengas.','I want you to come. (desire -> subjunctive)'],['Es importante que estudies.','It is important that you study. (impersonal expression)'],['No creo que el tenga razon.','I do not think he is right. (doubt)']],tip:'Subjunctive triggers (WEIRDO): Wishes, Emotions, Impersonal expressions, Recommendations, Doubt/Denial, Ojalaque. Formation: take yo present form, drop -o, add opposite endings (-ar verbs use -e endings; -er/-ir use -a endings).'},
g3_para_por:{title:'Para vs. Por',summary:'Both translate as for in English but have distinct uses. PARA points forward to purpose, destination, or deadline. POR looks backward to cause, exchange, or duration.',examples:[['Estudio espanol para hablar con mi familia.','I study Spanish in order to speak with my family. (purpose -> PARA)'],['Gracias por tu ayuda.','Thank you for your help. (in exchange for -> POR)'],['El libro fue escrito por Cervantes.','The book was written by Cervantes. (agent -> POR)']],tip:'PARA = Purpose/goal, Recipient, Deadline, Destination, Opinion (para mi = in my opinion). POR = Duration, Exchange, Movement through, Agent in passive, Cause/motive, On behalf of.'},
g3_conjunctions:{title:'Correlative Conjunctions',summary:'Correlative conjunctions come in pairs and connect parallel elements. The most important pairs in Spanish are o...o..., ni...ni..., and tanto...como...',examples:[['O estudias o miras television.','Either you study or you watch TV.'],['No me gusta ni el cafe ni el te.','I like neither coffee nor tea.'],['Habla tanto espanol como ingles.','She speaks both Spanish and English.']],tip:'O...o... = either...or... (choice). Ni...ni... = neither...nor... (double negative - correct in Spanish!). Tanto...como... = both...and... / as much...as... Remember: ni requires no agreement with verb if it comes before.'},
g3_indirect:{title:'Indirect Commands',summary:'Indirect commands tell a third party to do something. They use the formula: que + present subjunctive. Often translated as let him/her/them... or have him/her/them...',examples:[['Que entre Maria.','Let Maria come in. / Have Maria come in.'],['Que esperen ellos.','Let them wait.'],['Que lo haga Juan.','Have Juan do it. / Let Juan do it.']],tip:'Structure: Que + (subject) + present subjunctive. The subject is optional and can come before or after the verb. Use when you want someone to relay a command or when saying let + person + verb.'},
g3_passive:{title:'Passive Voice (Se)',summary:'Spanish commonly uses SE to express passive meaning and impersonal statements. The verb agrees with the grammatical subject (the thing done), not a person.',examples:[['Se venden zapatos aqui.','Shoes are sold here. (zapatos = plural -> venden)'],['Se habla espanol en este pais.','Spanish is spoken in this country.'],['No se puede fumar aqui.','Smoking is not allowed here.']],tip:'Se + verb (3rd person). If followed by plural noun, verb is plural: se venden libros. If followed by infinitive or singular noun, verb is singular: se habla, se puede. Used for signs, instructions, and general statements about what is done.'},
g3_subjunctive2:{title:'Subjunctive — Key Triggers',summary:'Learning which expressions trigger the subjunctive is the key to using it correctly. The most important triggers fall into clear categories.',examples:[['Quiero que ella venga.','I want her to come. (desire)'],['Es importante que estudies.','It is important that you study. (impersonal expression)'],['Dudo que el sepa la respuesta.','I doubt he knows the answer. (doubt)']],tip:'Main triggers: DESIRE: querer que, esperar que, pedir que. EMOTION: alegrarse de que, temer que, sorprender que. IMPERSONAL: es importante/necesario/posible que. DOUBT: dudar que, no creer que. SPECIAL: ojala que, cuando (future), buscar algo que (indefinite antecedent).'},
};

function loadMastery(){try{return JSON.parse(localStorage.getItem('nsa3_mastery')||'{}');}catch{return{};}}
function saveMastery(m){try{localStorage.setItem('nsa3_mastery',JSON.stringify(m));}catch{}}
function getWordStatus(topicId,word){const m=loadMastery();const d=m[topicId]?.[word];if(!d||d.correct===0)return'new';const u=new Set(d.sessions||[]).size;if(d.correct>=3&&u>=2)return'mastered';if(d.correct>=3)return'familiar';return'learning';}
function recordAnswer(topicId,word,correct,sessionDate){const m=loadMastery();if(!m[topicId])m[topicId]={};if(!m[topicId][word])m[topicId][word]={correct:0,wrong:0,sessions:[]};if(correct){m[topicId][word].correct++;if(!m[topicId][word].sessions.includes(sessionDate))m[topicId][word].sessions.push(sessionDate);}else m[topicId][word].wrong=(m[topicId][word].wrong||0)+1;saveMastery(m);}
function getTopicStats(id,keys){const c={new:0,learning:0,familiar:0,mastered:0};keys.forEach(k=>c[getWordStatus(id,k)]++);return c;}
function getTopicBadge(id,keys){const s=getTopicStats(id,keys),t=keys.length;if(s.mastered===t)return{label:'Mastered',cls:'badge-mastered'};if(s.mastered>0||s.familiar>0)return{label:'In progress',cls:'badge-learning'};return{label:'New',cls:'badge-new'};}
 
const ACT=['multiple-choice','audio-to-word','matching','listen-match','fill-blank','multiple-choice'];
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function todayStr(){return new Date().toISOString().split('T')[0];}
function pickWords(t,n=6){const g={new:[],learning:[],familiar:[],mastered:[]};t.words.forEach(w=>g[getWordStatus(t.id,w[0])].push(w));return[...g.new,...g.learning,...g.familiar,...g.mastered].slice(0,n);}
function buildVocabSession(t){const words=pickWords(t,Math.min(t.words.length,8));return words.map((w,i)=>buildActivity(ACT[i%ACT.length],w,t));}
function buildActivity(type,word,topic){
  const[sp,en]=word;const dist=topic.words.filter(w=>w[0]!==sp).sort(()=>Math.random()-.5).slice(0,3);
  if(type==='multiple-choice'){const opts=shuffle([en,...dist.map(d=>d[1])]);return{type,word:sp,answer:en,question:`What does "${sp}" mean?`,options:opts,correct:opts.indexOf(en),actLabel:'Multiple Choice'};}
  if(type==='audio-to-word'){const opts=shuffle([en,...dist.map(d=>d[1])]);return{type,word:sp,answer:en,question:'Listen and choose the correct meaning.',options:opts,correct:opts.indexOf(en),actLabel:'Listen & Choose'};}
  if(type==='fill-blank'){return{type,word:sp,answer:sp,question:`Translate to Spanish: "${en}"`,actLabel:'Fill in the Blank'};}
  if(type==='matching'||type==='listen-match'){const pairs=shuffle([word,...dist.slice(0,3)]).slice(0,4);return{type:'matching',listenMode:type==='listen-match',word:sp,pairs,actLabel:type==='listen-match'?'Listen & Match':'Read & Match'};}
  const opts=shuffle([en,...dist.map(d=>d[1])]);return{type:'multiple-choice',word:sp,answer:en,question:`What does "${sp}" mean?`,options:opts,correct:opts.indexOf(en),actLabel:'Multiple Choice'};
}
function buildGrammarSession(t){const g={new:[],learning:[],familiar:[],mastered:[]};t.questions.forEach(q=>g[getWordStatus(t.id,q.q)].push(q));return shuffle([...g.new,...g.learning,...g.familiar,...g.mastered]).slice(0,8).map(q=>({type:'grammar-mc',word:q.q,question:q.q,options:q.opts,correct:q.ans,explanation:q.exp,actLabel:'Grammar in Action',isGrammar:true}));}

function getSpanishVoices(){return window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es')).sort((a,b)=>a.name.localeCompare(b.name));}
function getSavedVoice(){const saved=localStorage.getItem('nsa_voice');const voices=getSpanishVoices();if(saved){const v=voices.find(v=>v.name===saved);if(v)return v;}return voices.find(v=>/Monica|Jorge|Paulina|Diego/i.test(v.name))||voices[0]||null;}
function getSavedRate(){return parseFloat(localStorage.getItem('nsa_rate')||'0.85');}
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=getSavedRate();u.pitch=1;const v=getSavedVoice();if(v)u.voice=v;window.speechSynthesis.speak(u);}
window.speechSynthesis&&window.speechSynthesis.getVoices();

const hdr=a=>`<div class="header"><div class="header-left"><span class="h-title">Practica</span><span class="h-sub">Nivel Tres · Spanish 3</span></div><div class="h-nav"><button class="nav-btn" id="nav-hub">&#8592; Hub</button><button class="nav-btn${a==='home'?' active':''}" id="nav-home">Inicio</button><button class="nav-btn${a==='progress'?' active':''}" id="nav-prog">Progreso</button><button class="nav-btn${a==='settings'?' active':''}" id="nav-set">&#9881; Voz</button></div></div>`;
 
function homeHTML(){
  const tV=VOCAB_TOPICS.reduce((a,t)=>a+t.words.length,0),mV=VOCAB_TOPICS.reduce((a,t)=>a+t.words.filter(([w])=>getWordStatus(t.id,w)==='mastered').length,0);
  const tG=GRAMMAR_TOPICS.reduce((a,t)=>a+t.questions.length,0),mG=GRAMMAR_TOPICS.reduce((a,t)=>a+t.questions.filter(q=>getWordStatus(t.id,q.q)==='mastered').length,0);
  const tR=READING_PASSAGES.reduce((a,p)=>a+p.questions.length,0),mR=READING_PASSAGES.reduce((a,p)=>a+p.questions.filter(q=>getWordStatus('r3_'+p.id,q.q)==='mastered').length,0);
  const total=tV+tG+tR,mast=mV+mG+mR;
  return hdr('home')+`<div class="main">
  <div class="intro" style="margin-bottom:16px"><h2>Que quieres practicar?</h2><p>NSA Level 3 — Intermediate Low. Vocabulary, grammar, and authentic reading practice with mastery tracking.</p></div>
  <div class="stats-bar"><div><div class="stats-big">${mast}</div><div class="stats-sub">mastered of ${total} total</div></div>
  <div style="flex:1"><div style="height:7px;background:var(--cream-dark);border-radius:4px;overflow:hidden;margin-bottom:8px"><div style="height:7px;background:var(--correct);border-radius:4px;width:${total?Math.round(mast/total*100):0}%"></div></div>

  <div class="section-header"><div class="section-header-title" style="color:var(--gold)">Vocabulary</div><div class="section-header-line"></div><div style="font-size:11px;color:var(--muted)">${mV}/${tV}</div></div>

function sessionHTML(){
  const act=S.activities[S.current];const pct=Math.round((S.current/S.activities.length)*100);
  const topic=S.mode==='vocab'?VOCAB_TOPICS.find(t=>t.id===S.topicId):GRAMMAR_TOPICS.find(t=>t.id===S.topicId);
  let body='';
  if(act.type==='grammar-mc'||act.type==='multiple-choice')body=mcHTML(act);
  else if(act.type==='audio-to-word')body=audioHTML(act);
  else if(act.type==='fill-blank')body=fillHTML(act);
  else if(act.type==='matching')body=matchHTML(act);
  return`${hdr('home')}<div class="activity-header"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="strip-info">${topic.icon} ${topic.label}</span><span class="strip-score">${S.sessionCorrect}&#10003; ${S.current+1}/${S.activities.length}</span></div>
  <div class="main"><div class="activity-type-badge${act.isGrammar?' grammar-badge':''}">${act.isGrammar?'&#9999;':act.type==='audio-to-word'?'&#128266;':act.type==='matching'?act.listenMode?'&#128266;':'&#128279;':'&#9997;'} ${act.actLabel}</div>${body}</div>`;
}
 
const L=['A','B','C','D'];
function mcHTML(act){return`<div class="q-text">${act.question}</div><div class="options-grid">${act.options.map((opt,i)=>{let cls='';if(S.answered){if(i===act.correct)cls='correct';else if(i===S.chosen&&i!==act.correct)cls='wrong';}return`<button class="option ${cls}" data-opt="${i}" ${S.answered?'disabled':''}><span class="opt-letter">${L[i]}</span>${opt}</button>`;}).join('')}</div>${fbHTML(act)}`;}
function audioHTML(act){return`<div class="audio-prompt" id="audio-btn" data-speak="${act.word}"><div class="audio-icon">&#128266;</div><div class="audio-word">${act.word}</div><div class="audio-hint">Tap to hear</div></div><div class="q-text" style="font-size:15px">${act.question}</div><div class="options-grid two-col">${act.options.map((opt,i)=>{let cls='';if(S.answered){if(i===act.correct)cls='correct';else if(i===S.chosen&&i!==act.correct)cls='wrong';}return`<button class="option ${cls}" data-opt="${i}" ${S.answered?'disabled':''}><span class="opt-letter">${L[i]}</span>${opt}</button>`;}).join('')}</div>${fbHTML(act)}`;}
function fillHTML(act){let cls='';if(S.answered){const ok=S.fillValue.trim().toLowerCase()===act.answer.toLowerCase();cls=ok?'correct':'wrong';}return`<div class="q-text">${act.question}</div><input class="blank-input ${cls}" id="fill-input" type="text" placeholder="Type in Spanish..." value="${S.fillValue}" ${S.answered?'disabled':''}/>
${!S.answered?`<button class="submit-btn" id="fill-submit">Check</button>`:''}${S.answered?fillFbHTML(act):''}`;}
function fillFbHTML(act){const ok=S.fillValue.trim().toLowerCase()===act.answer.toLowerCase();return`<div class="feedback ${ok?'correct-fb':'wrong-fb'}"><strong>${ok?'Correcto!':'Not quite.'}</strong>${ok?'':` The answer is <strong>${act.answer}</strong>.`}</div><button class="next-btn" id="next-btn">${S.current<S.activities.length-1?'Siguiente':'Ver resultados'}</button>`;}
function matchHTML(act){
  const pairs=act.pairs;const lw=pairs.map(p=>p[0]);
  if(!act._rw)act._rw=shuffle(pairs.map(p=>p[1]));if(!act._heard)act._heard={};
  const rw=act._rw;const lm=act.listenMode;
  return`<div class="q-text" style="font-size:15px">${lm?'Tap to hear, then match to English.':'Match each Spanish word to its English meaning.'}</div>
  <div class="match-progress">${S.matchedPairs.length} / ${pairs.length} matched</div>
  <div class="match-grid"><div><div class="match-col-label">${lm?'Tap to hear':'Espanol'}</div>
  ${lw.map((w,i)=>{const im=S.matchedPairs.some(mp=>mp[0]===i),is=S.matchLeft===i,iw=S.wrongFlash==='L'+i;
    if(lm){const h=act._heard[i];return`<div class="match-card${im?' matched':is?' selected':iw?' wrong-flash':''}" data-left="${i}" data-speak="${w}" style="margin-bottom:7px;flex-direction:column;gap:4px;padding:10px 8px;min-height:60px">${im?`<span>&#10003;</span><span style="font-size:11px;color:var(--correct)">${w}</span>`:`<span style="font-size:22px">${h?'&#128266;':'&#128264;'}</span><span style="font-size:10px;color:${is?'var(--navy)':'var(--muted)'}">${h?'replay':'tap to hear'}</span>`}</div>`;}
    return`<div class="match-card${im?' matched':is?' selected':iw?' wrong-flash':''}" data-left="${i}" style="margin-bottom:7px">${w}</div>`;
  }).join('')}</div>
  <div><div class="match-col-label">English</div>${rw.map((w,i)=>{const im=S.matchedPairs.some(mp=>mp[1]===i),is=S.matchRight===i,iw=S.wrongFlash==='R'+i;return`<div class="match-card${im?' matched':is?' selected':iw?' wrong-flash':''}" data-right="${i}" style="margin-bottom:7px">${w}</div>`;}).join('')}</div></div>
  ${S.matchedPairs.length===pairs.length?`<div class="feedback correct-fb"><strong>Perfecto!</strong></div><button class="next-btn" id="next-btn">${S.current<S.activities.length-1?'Siguiente':'Ver resultados'}</button>`:''}`;}
function fbHTML(act){if(!S.answered)return'';const ok=S.chosen===act.correct;return`<div class="feedback ${ok?'correct-fb':'wrong-fb'}"><strong>${ok?'Correcto!':'Not quite.'}</strong>${ok?'':` The answer is <strong>${act.options?act.options[act.correct]:act.answer}</strong>.`}${act.explanation?`<br><span style="margin-top:4px;display:block">${act.explanation}</span>`:''}</div><button class="next-btn" id="next-btn">${S.current<S.activities.length-1?'Siguiente':'Ver resultados'}</button>`;}

function bind(){
  document.getElementById('nav-hub')?.addEventListener('click',()=>{window.location.href='/proficiency-practice-lab/';});
  document.getElementById('nav-home')?.addEventListener('click',()=>{S.screen='home';render();});
  document.getElementById('nav-prog')?.addEventListener('click',()=>{S.screen='progress';render();});
  document.getElementById('nav-set')?.addEventListener('click',()=>{S.screen='settings';render();});
  document.querySelectorAll('[data-topic]').forEach(c=>c.addEventListener('click',()=>{
    const mode=c.dataset.mode,topicId=c.dataset.topic;
    if(mode==='grammar'){S.topicId=topicId;S.mode=mode;S.screen='concept';render();}
    else if(mode==='reading'){S.topicId=topicId;S.mode='reading';S.screen='reading';S.readingPassage=READING_PASSAGES.find(p=>p.id===topicId);S.readingQ=0;S.readingScore=0;S.readingAnswered=false;S.readingChosen=null;render();}
    else{startSession(topicId,mode);}
  }));
  document.getElementById('start-practice-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.getElementById('skip-concept-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>answerMC(+b.dataset.opt)));
  document.getElementById('audio-btn')?.addEventListener('click',function(){speak(this.dataset.speak);});
  const fi=document.getElementById('fill-input');if(fi){fi.addEventListener('input',e=>{S.fillValue=e.target.value;});fi.addEventListener('keydown',e=>{if(e.key==='Enter')submitFill();});}
  document.getElementById('fill-submit')?.addEventListener('click',submitFill);
  document.querySelectorAll('[data-left]').forEach(c=>c.addEventListener('click',()=>{const act=S.activities[S.current];const i=+c.dataset.left;const word=act.listenMode?c.dataset.speak:act.pairs[i][0];if(word)speak(word);if(act.listenMode)act._heard[i]=true;matchSelectLeft(i);}));
  document.querySelectorAll('[data-right]').forEach(c=>c.addEventListener('click',()=>matchSelectRight(+c.dataset.right)));
  document.getElementById('next-btn')?.addEventListener('click',nextActivity);
  document.getElementById('retry-btn')?.addEventListener('click',()=>startSession(S.topicId,S.mode));
  document.getElementById('home-btn')?.addEventListener('click',()=>{S.screen='home';render();});
  document.querySelectorAll('[data-ropt]').forEach(b=>b.addEventListener('click',()=>{if(S.readingAnswered)return;const i=+b.dataset.ropt;const p=S.readingPassage;const q=p.questions[S.readingQ];S.readingAnswered=true;S.readingChosen=i;if(i===q.ans){S.readingScore++;recordAnswer('r3_'+p.id,q.q,true,S.sessionDate);}else recordAnswer('r3_'+p.id,q.q,false,S.sessionDate);render();}));
  document.getElementById('reading-next')?.addEventListener('click',()=>{S.readingQ++;S.readingAnswered=false;S.readingChosen=null;render();});
  document.getElementById('reading-retry')?.addEventListener('click',()=>{S.readingQ=0;S.readingScore=0;S.readingAnswered=false;S.readingChosen=null;render();});
  document.getElementById('clear-btn')?.addEventListener('click',()=>{if(confirm('Reset all Level 3 progress?')){localStorage.removeItem('nsa3_mastery');render();}});
  document.querySelectorAll('[data-voice]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('nsa_voice',b.dataset.voice);speak(b.dataset.preview||'hola');render();}));
  document.getElementById('rate-slider')?.addEventListener('input',e=>localStorage.setItem('nsa_rate',e.target.value));
}
 
function startSession(topicId,mode){
  S.topicId=topicId;S.mode=mode;
  S.activities=mode==='grammar'?buildGrammarSession(GRAMMAR_TOPICS.find(t=>t.id===topicId)):buildVocabSession(VOCAB_TOPICS.find(t=>t.id===topicId));
  S.current=0;S.sessionCorrect=0;S.sessionDate=todayStr();S.answered=false;S.chosen=null;S.fillValue='';S.matchLeft=null;S.matchRight=null;S.matchedPairs=[];S.wrongFlash=null;
  S.screen='session';render();
  const act=S.activities[0];
  if(act.type==='audio-to-word')setTimeout(()=>speak(act.word),400);
  if(act.type==='matching'&&act.listenMode)setTimeout(()=>{speak(act.pairs[0][0]);act._heard[0]=true;render();},400);
}
function answerMC(i){if(S.answered)return;const act=S.activities[S.current];S.answered=true;S.chosen=i;const ok=i===act.correct;if(ok)S.sessionCorrect++;recordAnswer(S.topicId,act.word,ok,S.sessionDate);render();}
function submitFill(){if(S.answered)return;const act=S.activities[S.current];S.answered=true;const ok=S.fillValue.trim().toLowerCase()===act.answer.toLowerCase();if(ok)S.sessionCorrect++;recordAnswer(S.topicId,act.word,ok,S.sessionDate);render();}
function matchSelectLeft(i){const act=S.activities[S.current];if(S.matchedPairs.some(mp=>mp[0]===i))return;S.matchLeft=i;S.wrongFlash=null;if(S.matchRight!==null)tryMatch(act);else render();}
function matchSelectRight(i){const act=S.activities[S.current];if(S.matchedPairs.some(mp=>mp[1]===i))return;S.matchRight=i;S.wrongFlash=null;if(S.matchLeft!==null)tryMatch(act);else render();}
function tryMatch(act){const li=S.matchLeft,ri=S.matchRight;const lw=act.pairs[li][0];const rw=act._rw[ri];const ok=act.pairs.find(p=>p[0]===lw&&p[1]===rw);if(ok){S.matchedPairs.push([li,ri]);recordAnswer(S.topicId,lw,true,S.sessionDate);if(S.matchedPairs.length===act.pairs.length)S.sessionCorrect++;}else{recordAnswer(S.topicId,lw,false,S.sessionDate);S.wrongFlash='L'+li;setTimeout(()=>{S.wrongFlash=null;S.matchLeft=null;S.matchRight=null;render();},700);}S.matchLeft=null;S.matchRight=null;render();}
function nextActivity(){if(S.current<S.activities.length-1){S.current++;S.answered=false;S.chosen=null;S.fillValue='';S.matchLeft=null;S.matchRight=null;S.matchedPairs=[];S.wrongFlash=null;render();const act=S.activities[S.current];if(act.type==='audio-to-word')setTimeout(()=>speak(act.word),400);if(act.type==='matching'&&act.listenMode)setTimeout(()=>{speak(act.pairs[0][0]);act._heard[0]=true;render();},400);}else{S.screen='result';render();}}
 
render();
</script>
